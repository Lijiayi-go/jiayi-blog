<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的个人博客</title>
  <meta name="description" content="个人博客 · 简历 · 瞬间 · 关于我" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/home">
        <span class="brand-dot"></span>
        <span class="brand-name" id="brand-name">我的博客</span>
      </a>
      <nav class="nav">
        <a href="#/home" data-route="home" class="nav-link active">首页</a>
        <a href="#/moments" data-route="moments" class="nav-link">瞬间</a>
        <a href="#/about" data-route="about" class="nav-link">关于</a>
      </nav>
    </div>
  </header>

  <!-- 页面容器 -->
  <main id="app" class="page"></main>

  <!-- 页脚 -->
  <footer class="footer">
    <p>© <span id="footer-year"></span> <span id="footer-name"></span></p>
  </footer>

  <!-- AI 问答悬浮气泡 -->
  <div id="chat-widget">
    <button id="chat-toggle" class="chat-toggle" aria-label="打开小嘉翊">
      <span class="chat-toggle-icon">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </span>
      <span class="chat-toggle-close">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </span>
    </button>

    <div id="chat-panel" class="chat-panel" hidden>
      <div class="chat-head">
        <div class="chat-head-avatar">嘉</div>
        <div class="chat-head-meta">
          <div class="chat-head-title">小嘉翊</div>
          <div class="chat-head-sub">关于我 · 有问必答</div>
        </div>
        <button id="chat-clear" class="chat-clear" title="清空对话">清空</button>
      </div>
      <div id="chat-body" class="chat-body"></div>
      <div class="chat-foot">
        <textarea id="chat-input" class="chat-input" rows="1" placeholder="问我任何问题…"></textarea>
        <button id="chat-send" class="chat-send" aria-label="发送">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
  <script src="./pet.js"></script>
  <script src="./chat.js"></script>
</body>
</html>
